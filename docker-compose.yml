services:
  mongo:
    image: mongo:6-jammy
    container_name: fs-test-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: fs-test-be
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://mongo:27017/product_catalog
      - CLIENT_ORIGIN=http://localhost:5173
    volumes:
      - ./be:/app
      - /app/node_modules
    depends_on:
      - mongo

volumes:
  mongo-data:
